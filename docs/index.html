<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FES PML Macro Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="FES PML Macro Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="fesdocs.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'FES PML Macro',
      themeColor: '#3F51B5',
      loadNavbar: true,
      nameLink: {
        '/ja/': '#/ja/',
        '/': '#/',
      },
      loadSidebar: true,
      subMaxLevel: 6,
      auto2top: true,
      nativeEmoji: true,
      relativePath: true,
      requestHeaders: {
        'cache-control': 'max-age=600',
      },
      plugins: [
        function pageFooter(hook, vm) {
          hook.afterEach((html) => html + `<footer><hr/>&copy; ${(new Date()).getFullYear()} Fuji Engineering Service Co., Ltd. </footer>`);
        },
        function setLang(hook, vm) {
          hook.afterEach(function (html) {
            const lang = location.hash.match(/#\/(ja)\//);
            if (lang) {
              document.documentElement.setAttribute('lang', lang[1]);
              return html.replace(/<img src="(.*?)\/ja\/(.*?)"/g, '<img src="$1/$2"');
            } else {
              document.documentElement.setAttribute('lang', 'en');
              return html;
            }
          });
        },
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1/dist/docsify-plugin-flexible-alerts.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
